# Local infrastructure for the optional profiles:
#   kafka:    single-node Kafka (KRaft, no ZooKeeper) on localhost:9092
#   postgres: PostgreSQL on localhost:5432; data survives restarts in the "postgres-data" volume
#             (`docker compose down -v` deletes it)
# Start one with `docker compose up -d kafka` / `docker compose up -d postgres`, or both with `docker compose up -d`.
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
