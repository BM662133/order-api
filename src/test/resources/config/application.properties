# Loaded on top of src/main/resources/application.properties (classpath:/config/ wins over classpath:/).
# All test contexts share one in-memory H2 database, so a scheduler in any cached context would process
# other test classes' events. Tests call OutboxRelay.relayDue() themselves instead; only
# ProvisioningEndToEndTest turns scheduling back on.
orders.outbox.scheduling-enabled=false
# Failed events are due again immediately, so a test can drive retries with repeated relayDue() calls.
orders.outbox.initial-backoff=0s
