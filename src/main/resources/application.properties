spring.application.name=order-api

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health

# Transactional outbox (see OutboxRelay). The scheduler polls for due events; set
# scheduling-enabled=false to drive OutboxRelay.relayDue() by hand (the tests do).
orders.outbox.scheduling-enabled=true
orders.outbox.poll-interval=500ms
orders.outbox.batch-size=50
orders.outbox.max-attempts=5
orders.outbox.initial-backoff=1s
orders.outbox.max-backoff=60s
