spring.application.name=order-api

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health

# On shutdown, let a running background job (e.g. a relay pass waiting for broker acks) finish rather than
# interrupting it; 20s is longer than the Kafka send-timeout (15s).
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s

# Transactional outbox (see OutboxRelay). The scheduler polls for due events; set
# scheduling-enabled=false to drive OutboxRelay.relayDue() by hand (the tests do).
orders.outbox.scheduling-enabled=true
# in-process (default): the relay calls handlers directly. kafka: see application-kafka.properties.
orders.outbox.transport=in-process
orders.outbox.poll-interval=500ms
orders.outbox.batch-size=50
orders.outbox.max-attempts=5
orders.outbox.initial-backoff=1s
orders.outbox.max-backoff=60s
# How long a relay pass owns the events it claimed (several instances can share the outbox); must be
# longer than the slowest pass. See OutboxProperties.
orders.outbox.claim-lease=60s

# Idempotency keys are reserved for key-ttl from order creation, then may be reused.
orders.idempotency.key-ttl=24h
orders.idempotency.purge-enabled=true
orders.idempotency.purge-interval=1h

# Provisioning sweeper: retries stalled orders and reconciles uncertain failures with the gateway.
orders.provisioning.sweep.enabled=true
orders.provisioning.sweep.interval=1m
orders.provisioning.sweep.stalled-after=15m
orders.provisioning.sweep.batch-size=100
