# Profile "postgres": a persistent PostgreSQL database instead of in-memory H2.
#   docker compose up -d postgres
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres      (combine with kafka: postgres,kafka)
# Data survives restarts, so Flyway migrations are now applied once and kept: never edit an applied one.
spring.datasource.url=jdbc:postgresql://localhost:5432/orders
spring.datasource.username=orders
spring.datasource.password=orders
