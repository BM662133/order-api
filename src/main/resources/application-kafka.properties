# Profile "kafka": deliver outbox events through Kafka instead of in-process.
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=kafka
orders.outbox.transport=kafka
orders.outbox.kafka.partitions=3
# Longer than delivery.timeout.ms below, so the producer reports the failure first.
orders.outbox.kafka.send-timeout=15s

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# The relay sends a whole batch before waiting for acks; give the producer a moment to pack it into
# a few requests.
spring.kafka.producer.properties.linger.ms=5
# Fail within seconds when the broker is down, instead of blocking the relay thread for a minute.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# A new consumer group starts from the beginning, so events published before it started aren't skipped.
spring.kafka.consumer.auto-offset-reset=earliest
